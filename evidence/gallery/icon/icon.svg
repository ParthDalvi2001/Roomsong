<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Roomsong app icon draft (T-182). Hand-written SVG, original: the ring-shaped bed seen from a seat, its five
       pitch rings, the ring of light passing, and glowing plants in the palette's colours (src/render/config.ts and
       palette.ts: gold 47 deg, MOSS, ICE, VIOLET, CREAM, BED_BASE_COLOUR). Full bleed; everything that matters sits
       inside the central 80 % circle, so a platform's round or squircle mask cuts nothing. -->
  <defs>
    <radialGradient id="night" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#1d2a35"/>
      <stop offset="1" stop-color="#070a0d"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0.55" stop-color="#48cae4" stop-opacity="0"/>
      <stop offset="0.8" stop-color="#48cae4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#48cae4" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#night)"/>
  <!-- the aurora halo: a soft band round the rim -->
  <ellipse cx="256" cy="312" rx="232" ry="118" fill="url(#halo)"/>
  <!-- the bed: charcoal glass, inner radius 0.4 of the outer (0.12 / 0.30 m), seen from a seat -->
  <path d="M60 312 a196 90.2 0 1 0 392 0 a196 90.2 0 1 0 -392 0 Z M178 312 a78 35.9 0 1 1 156 0 a78 35.9 0 1 1 -156 0 Z"
        fill="#141a1f" fill-rule="evenodd"/>
  <g fill="none" stroke="#48cae4" stroke-opacity="0.55" stroke-width="2.5">
    <ellipse cx="256" cy="312" rx="89.8" ry="41.3"/>
    <ellipse cx="256" cy="312" rx="113.4" ry="52.2"/>
    <ellipse cx="256" cy="312" rx="137" ry="63"/>
    <ellipse cx="256" cy="312" rx="160.6" ry="73.9"/>
    <ellipse cx="256" cy="312" rx="184.2" ry="84.7"/>
  </g>
  <ellipse cx="256" cy="312" rx="196" ry="90.2" fill="none" stroke="#fff8e7" stroke-opacity="0.6" stroke-width="3"/>
  <!-- the ring of light: its wake, fading behind it -->
  <g fill="#fff8e7">
    <path d="M437.7 345.8 L434.7 349.0 L431.4 352.2 L427.8 355.4 L424.0 358.4 L419.9 361.4 L415.6 364.4 L411.0 367.2 L406.1 370.0 L315.8 335.1 L317.7 334.0 L319.5 332.8 L321.2 331.7 L322.9 330.5 L324.4 329.3 L325.8 328.0 L327.1 326.7 L328.3 325.4 Z" fill-opacity="0.3"/>
    <path d="M451.5 318.3 L450.8 321.8 L449.8 325.3 L448.6 328.8 L447.0 332.3 L445.1 335.7 L442.9 339.1 L440.5 342.5 L437.7 345.8 L328.3 325.4 L329.4 324.1 L330.4 322.8 L331.3 321.4 L332.0 320.1 L332.6 318.7 L333.1 317.3 L333.5 315.9 L333.8 314.5 Z" fill-opacity="0.1"/>
  </g>
  <!-- the plants behind the middle: stems, then blooms -->
  <g stroke-width="6" stroke-linecap="round">
    <line x1="152.8" y1="255.4" x2="152.8" y2="150.4" stroke="#9b5de5"/>
    <line x1="294.8" y1="263.0" x2="294.8" y2="183.0" stroke="#7dd181"/>
    <line x1="406.9" y1="263.4" x2="406.9" y2="168.4" stroke="#48cae4"/>
    <line x1="123.7" y1="295.7" x2="123.7" y2="225.7" stroke="#e4c658"/>
  </g>
  <g filter="url(#glow)">
    <circle cx="152.8" cy="146" r="20" fill="#9b5de5"/>
    <circle cx="294.8" cy="179" r="18" fill="#7dd181"/>
    <circle cx="406.9" cy="164" r="19" fill="#48cae4"/>
    <circle cx="123.7" cy="222" r="16" fill="#e4c658"/>
  </g>
  <!-- the Listen orb over the bed's middle -->
  <circle cx="256" cy="300" r="9" fill="#fff8e7" fill-opacity="0.9" filter="url(#glow)"/>
  <!-- the ring of light's leading edge -->
  <line x1="317.3" y1="335.7" x2="404.6" y2="369.4" stroke="#fff8e7" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
  <!-- the plants in front: the one on the light sings, larger and brighter -->
  <g stroke-width="6" stroke-linecap="round">
    <line x1="379.0" y1="359.5" x2="379.0" y2="239.5" stroke="#e4c658"/>
    <line x1="191.0" y1="354.7" x2="191.0" y2="269.7" stroke="#48cae4"/>
    <line x1="96.5" y1="354.4" x2="96.5" y2="254.4" stroke="#7dd181"/>
    <line x1="267.9" y1="374.8" x2="267.9" y2="309.8" stroke="#9b5de5"/>
  </g>
  <g filter="url(#glow)">
    <circle cx="379.0" cy="234" r="25" fill="#e4c658"/>
    <circle cx="191.0" cy="266" r="18" fill="#48cae4"/>
    <circle cx="96.5" cy="250" r="19" fill="#7dd181"/>
    <circle cx="267.9" cy="306" r="16" fill="#9b5de5"/>
  </g>
  <circle cx="379.0" cy="234" r="9" fill="#fff8e7"/>
</svg>
